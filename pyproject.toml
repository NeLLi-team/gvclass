[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gvclass"
version = "2.1.1"
description = "Giant virus classification tool using phylogenetic analysis"
authors = [{ name = "Frederik Schulz" }]
requires-python = ">=3.11,<3.12"
license = { file = "LICENCE" }
readme = "README.md"
keywords = [
  "bioinformatics",
  "virus",
  "phylogenetics",
  "nucleocytoviricota",
  "giant-virus",
  "classification",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/NeLLi-team/gvclass"
Issues = "https://github.com/NeLLi-team/gvclass/issues"

[project.scripts]
# Native runs only. Container mode (--apptainer, --image) needs the `gvclass`
# launcher script, which this entry point does not run.
gvclass = "src.bin.gvclass_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
# Contamination + completeness models ship via the runtime resources tarball
# (under resources/contamination/ and resources/completeness/), not as Python
# package data. Only the config tree is retained here.
"src.config" = ["*.py", "*.tsv", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers"]
markers = [
  "slow: tests that take more than a few seconds",
  "requires_db: tests that need the GVClass reference database",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
# The codes below are deferred, not clean. Errors per code on 2026-11-09:
# arg-type 15, attr-defined 3, var-annotated 3, call-overload 2, import-untyped 1,
# return-value 1.
disable_error_code = [
  "arg-type",
  "attr-defined",
  "call-overload",
  "import-untyped",
  "return-value",
  "var-annotated",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# The banner is one long ANSI-coloured f-string per row.
"src/bin/cli_display.py" = ["E501"]
