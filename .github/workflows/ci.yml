name: CI

on:
  push:
    branches: [main, "v*"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, type-check, and unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.0
        with:
          pixi-version: v0.72.0
          cache: true

      - name: Lint (flake8)
        run: pixi run lint

      - name: Type-check (mypy)
        run: pixi run type-check

      - name: Unit tests (pytest)
        run: pixi run test

  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.0
        with:
          pixi-version: v0.72.0
          cache: true

      - name: Run public repo hygiene checks
        run: pixi run pytest tests/test_repo_hygiene.py -q

  golden-file:
    name: Golden-file regression on example/
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.0
        with:
          pixi-version: v0.72.0
          cache: true

      - name: Read expected DB version
        id: dbhash
        run: |
          python - <<'PY' >> $GITHUB_OUTPUT
          import re, pathlib
          txt = pathlib.Path("config/gvclass_config.yaml").read_text()
          version = re.search(r"^\s*download_version:\s*(\S+)\s*$", txt, re.M)
          print(f"version={version.group(1) if version else 'unknown'}")
          PY

      - name: Cache GVClass resources tarball and extracted DB
        uses: actions/cache@v4
        with:
          path: |
            resources
          key: gvclass-db-${{ steps.dbhash.outputs.version }}

      - name: Install pixi environment and download DB if not cached
        run: |
          pixi install
          installed_version="$(cat resources/DB_VERSION 2>/dev/null || true)"
          if [ ! -f resources/hmm/combined.hmm ] || [ "${installed_version}" != "${{ steps.dbhash.outputs.version }}" ]; then
            pixi run setup-db
          fi

      - name: Run golden-fixture regression test
        env:
          GVCLASS_RUN_GOLDEN: "1"
        run: |
          # tests/test_golden_example_summary.py runs `pixi run gvclass example`
          # with --mode-fast --plain-output, then projects the STABLE_COLUMNS
          # subset and diffs against tests/fixtures/expected_example_summary.tsv.
          # Keeps the test harness and the CI gate on exactly the same code
          # path.
          pixi run pytest tests/test_golden_example_summary.py -v

      - name: Audit compact resource labels and reference proteins
        env:
          GVCLASS_RUN_RESOURCE_AUDIT: "1"
        run: |
          pixi run pytest \
            tests/test_resource_label_integrity.py \
            tests/test_species_tree_config.py -v

  container-build:
    name: Build Apptainer SIF and smoke-test
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    needs: [lint-and-test, repo-hygiene, golden-file]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify release tag matches software version
        id: release
        shell: bash
        run: |
          software_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml | head -n 1)"
          test -n "${software_version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${software_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match software version ${software_version}" >&2
            exit 1
          fi
          echo "software_version=${software_version}" >> "${GITHUB_OUTPUT}"

      - name: Install Apptainer
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer

      - name: Build SIF
        run: |
          apptainer build gvclass.sif containers/apptainer/gvclass.def
          sha256sum gvclass.sif > gvclass.sif.sha256

      - name: Verify SIF software, resource, and model identities
        run: |
          # Exercise the bare `gvclass` command via PATH + the
          # /usr/local/bin/gvclass symlink and non-root exec permissions —
          # the way workflow engines (Snakemake/Nextflow) call it — rather
          # than the absolute /opt/gvclass/gvclass path. This way a regression
          # of the container command-publishing fix fails CI.
          version_output="$(apptainer exec gvclass.sif gvclass --version)"
          grep -Fqx "  Software version: v${{ steps.release.outputs.software_version }}" <<< "${version_output}"
          resolved="$(apptainer exec gvclass.sif sh -c 'command -v gvclass')"
          echo "gvclass resolves to: ${resolved}"
          test "${resolved}" = "/usr/local/bin/gvclass"
          apptainer exec gvclass.sif sh -c 'test "$GVCLASS_RESOURCE_CACHE" = "/resource-cache"'
          database_version="$(apptainer exec gvclass.sif cat /opt/gvclass/resources/DB_VERSION)"
          if [[ "${database_version}" != "v2.1.0" ]]; then
            echo "Release requires resource bundle v2.1.0; image contains ${database_version}" >&2
            exit 1
          fi
          apptainer exec gvclass.sif python - <<'PY'
          import hashlib
          from pathlib import Path

          from src.core.contamination_scoring import CONTAMINATION_MODEL_SHA256
          from src.core.novelty_completeness import COMPLETENESS_MODEL_SHA256

          expected_models = {
              Path("/opt/gvclass/resources/contamination/model.joblib"): CONTAMINATION_MODEL_SHA256,
              Path("/opt/gvclass/resources/completeness/model.joblib"): COMPLETENESS_MODEL_SHA256,
          }
          for model_path, expected_digest in expected_models.items():
              with model_path.open("rb") as model_file:
                  observed_digest = hashlib.file_digest(model_file, "sha256").hexdigest()
              if observed_digest != expected_digest:
                  raise SystemExit(
                      f"Model digest mismatch for {model_path}: "
                      f"expected {expected_digest}, got {observed_digest}"
                  )
              print(f"Verified {model_path}: {observed_digest}")
          PY

      - name: Record CPU and frozen SIF runtime metadata
        run: |
          mkdir -p "${RUNNER_TEMP}/gvclass-validation"
          lscpu --json > "${RUNNER_TEMP}/gvclass-validation/host-cpu.json"
          apptainer exec gvclass.sif python - <<'PYTHON' > "${RUNNER_TEMP}/gvclass-validation/sif-runtime.json"
          """Record library and CPU settings without process or environment dumps."""

          import json

          import numpy as np
          import scipy
          import sklearn
          import threadpoolctl
          import torch

          runtime = {
              "context": "fresh SIF process before CLI per-task thread limits",
              "torch_version": torch.__version__,
              "numpy_version": np.__version__,
              "scipy_version": scipy.__version__,
              "sklearn_version": sklearn.__version__,
              "torch_cpu_capability": torch.backends.cpu.get_cpu_capability(),
              "torch_num_threads": torch.get_num_threads(),
              "torch_num_interop_threads": torch.get_num_interop_threads(),
              "threadpools": [
                  {key: value for key, value in pool.items() if key != "filepath"}
                  for pool in threadpoolctl.threadpool_info()
              ],
              "torch_config": torch.__config__.show(),
          }
          print(json.dumps(runtime, indent=2))
          PYTHON

      - name: Run SIF classification and screen smoke tests
        shell: bash
        run: |
          apptainer run gvclass.sif screen --help
          mkdir -p "${RUNNER_TEMP}/gvclass-results" "${RUNNER_TEMP}/gvclass-cache" "${RUNNER_TEMP}/gvclass-validation"
          ./gvclass --image "${PWD}/gvclass.sif" example \
            -o "${RUNNER_TEMP}/gvclass-results" -t 4 --mode-fast --plain-output --verbose \
            --resource-cache-dir "${RUNNER_TEMP}/gvclass-cache" \
            2>&1 | tee "${RUNNER_TEMP}/gvclass-validation/classification.log"
          apptainer exec \
            -B "${RUNNER_TEMP}/gvclass-results:/output:ro" \
            -B "${RUNNER_TEMP}/gvclass-validation:/validation:ro" \
            -B "${PWD}/tests/fixtures/expected_example_summary.tsv:/expected.tsv:ro" \
            gvclass.sif python - <<'PYTHON'
          import csv
          from pathlib import Path

          from src.bin.gvclass_cli import CliOutput

          stable_columns = [
              "query",
              "taxonomy_majority",
              "species_tree_nn_taxonomy",
              "taxonomy_confidence",
              "capsid_group",
              "estimated_completeness",
              "completeness_query_support",
              "estimated_completeness_strategy",
              "completeness_model_group",
              "completeness_model_reliability",
              "estimated_contamination",
              "contamination_query_support",
              "estimated_contamination_strategy",
              "contamination_model_reliability",
              "contamination_type",
              "gvog4_completeness",
              "gvog8_completeness",
              "ncldv_mcp_total",
              "vp_completeness",
              "mirus_completeness",
              "busco_completeness",
              "cog_completeness",
              "ttable",
          ]

          def stable_summary(path):
              with Path(path).open() as handle:
                  return sorted(
                      tuple(row[column] for column in stable_columns)
                      for row in csv.DictReader(handle, delimiter="\t")
                  )

          expected = stable_summary("/expected.tsv")
          observed = stable_summary("/output/gvclass_summary.tsv")
          assert expected, "The golden fixture must contain classifications"
          assert observed == expected, (observed, expected)

          classification_log = Path("/validation/classification.log").read_text(encoding="utf-8")
          assert "\x1b" not in classification_log, "ANSI escape in plain output"
          decorations = (*CliOutput.ICONS.values(), "⚠", "✓")
          assert not any(symbol in classification_log for symbol in decorations), (
              "Decoration in plain output"
          )
          assert "Running pyswrd search:" in classification_log, "Missing search diagnostics"
          assert " - DEBUG - Processing marker " in classification_log, (
              "Missing verbose marker diagnostics"
          )
          PYTHON

      - name: Set up pinned Python for host module entrypoints
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          enable-cache: false

      - name: Verify resume through three host module entrypoints
        shell: bash
        run: |
          uv venv --no-project --managed-python --python 3.11.14 "${RUNNER_TEMP}/gvclass-host"
          uv pip install --python "${RUNNER_TEMP}/gvclass-host/bin/python" \
            --only-binary :all: biopython==1.85 numpy==2.4.2
          "${RUNNER_TEMP}/gvclass-host/bin/python" - \
            "${PWD}/gvclass.sif" "${RUNNER_TEMP}/gvclass-results" \
            "${RUNNER_TEMP}/gvclass-cache" "${RUNNER_TEMP}/gvclass-validation" <<'PYTHON'
          """Exercise three host module resume routes against one completed SIF run."""

          import hashlib
          import json
          import subprocess
          import sys
          import tarfile
          import time
          from pathlib import Path


          def scientific_snapshot(output: Path) -> dict[str, str]:
              """Hash summary bytes and archive file payloads, excluding gzip metadata."""
              hashes = {}
              for path in sorted(output.iterdir()):
                  if path.suffix in {".tsv", ".csv"}:
                      with path.open("rb") as handle:
                          hashes[path.name] = hashlib.file_digest(handle, "sha256").hexdigest()
                  if path.name.endswith(".tar.gz"):
                      with tarfile.open(path) as archive:
                          for member in archive.getmembers():
                              if member.isfile():
                                  handle = archive.extractfile(member)
                                  assert handle is not None, member.name
                                  with handle:
                                      hashes[f"{path.name}::{member.name}"] = hashlib.file_digest(
                                          handle, "sha256"
                                      ).hexdigest()
              return hashes


          def verify_resume(
              output: Path,
              log: str,
              expected: dict[str, str],
              times: dict[str, list[str]],
              baseline_json: str,
              previous_run_id: str,
          ) -> None:
              """Require three skips, no processing diagnostics and unchanged scientific data."""
              status = json.loads((output / "run_status.json").read_text(encoding="utf-8"))
              baseline = json.loads(baseline_json)
              assert status["status"] == "complete"
              assert status["run_id"] != previous_run_id, "Resume retained the previous run ID"
              assert status["database"] == baseline["database"]
              assert status["software_version"] == baseline["software_version"]
              assert status["settings"]["resume"] is True
              ignored = {"resume", "max_workers", "threads_per_worker"}
              assert {
                  key: value for key, value in status["settings"].items() if key not in ignored
              } == {
                  key: value for key, value in baseline["settings"].items() if key not in ignored
              }, "Resume changed stable settings"
              assert status["totals"]["resume_skipped"] == 3
              assert status["totals"]["queries"] == 3
              assert status["totals"]["failed"] == 0
              assert "Skipping 3 completed queries" in log
              assert "Processing 0 remaining queries" in log
              assert not any(
                  marker in log
                  for marker in (
                      "Processing query:",
                      "Running pyswrd search:",
                      "Running HMM search:",
                      "Optimizing genetic code for:",
                      " - DEBUG - Processing marker ",
                  )
              ), "Resume started scientific processing"
              assert scientific_snapshot(output) == expected, "Resume changed scientific output"
              observed_times = {
                  name: [query["started_at"], query["completed_at"]]
                  for name, query in status["queries"].items()
              }
              assert observed_times == times, "Resume changed query execution timestamps"
              assert all(query["resume_skipped"] for query in status["queries"].values())


          image, output, cache, evidence = map(Path, sys.argv[1:])
          status = json.loads((output / "run_status.json").read_text(encoding="utf-8"))
          assert len(status["queries"]) == 3
          assert (output / "gvclass_summary.tsv").is_file()
          assert (output / "gvclass_summary.csv").is_file()
          assert all((output / f"{name}.tar.gz").is_file() for name in status["queries"])
          baseline_json = json.dumps(status)
          previous_run_id = status["run_id"]
          before = scientific_snapshot(output)
          times = {
              name: [query["started_at"], query["completed_at"]]
              for name, query in status["queries"].items()
          }
          (evidence / "resume-before.json").write_text(
              json.dumps(
                  {"scientific_sha256": before, "query_times": times, "run_status": status},
                  indent=2,
              ),
              encoding="utf-8",
          )
          routes = [
              ("native-explicit", ["src.bin.gvclass_cli", "--apptainer", "--image", str(image)]),
              ("native-implicit", ["src.bin.gvclass_cli", f"--image={image}"]),
              ("container-module", ["src.bin.gvclass_apptainer", "--image", str(image)]),
          ]
          for name, entrypoint in routes:
              command = [
                  sys.executable,
                  "-m",
                  *entrypoint,
                  "example",
                  "-o",
                  str(output),
                  "--resource-cache-dir",
                  str(cache),
                  "-t",
                  "4",
                  "--mode-fast",
                  "--plain-output",
                  "--verbose",
                  "--resume",
              ]
              log_path = evidence / f"resume-{name}.log"
              time.sleep(1.1)  # Run IDs have one-second precision.
              with log_path.open("w", encoding="utf-8") as handle:
                  completed = subprocess.run(
                      command, stdout=handle, stderr=subprocess.STDOUT, check=False
                  )
              observed_status = json.loads(
                  (output / "run_status.json").read_text(encoding="utf-8")
              )
              (evidence / f"resume-{name}-observed.json").write_text(
                  json.dumps(
                      {
                          "returncode": completed.returncode,
                          "run_status": observed_status,
                          "scientific_sha256": scientific_snapshot(output),
                      },
                      indent=2,
                  ),
                  encoding="utf-8",
              )
              completed.check_returncode()
              verify_resume(
                  output,
                  log_path.read_text(encoding="utf-8"),
                  before,
                  times,
                  baseline_json,
                  previous_run_id,
              )
              previous_run_id = observed_status["run_id"]
              (evidence / f"resume-{name}.json").write_text(
                  json.dumps(
                      {
                          "route": name,
                          "skipped_queries": 3,
                          "reprocessed_queries": 0,
                          "scientific_outputs_unchanged": True,
                          "query_times_unchanged": True,
                      }
                  ),
                  encoding="utf-8",
              )
              print(f"Verified {name}: three skips, no recomputation, unchanged outputs")
          PYTHON

      - name: Verify host screen launcher rejects an invalid bundle
        run: |
          screen_test="$(mktemp -d "${RUNNER_TEMP}/gvclass-screen.XXXXXX")"
          mkdir -p "${screen_test}/cache/contig_screen"
          printf '{}\n' > "${screen_test}/cache/contig_screen/manifest.json"
          printf '>tiny\nACGT\n' > "${screen_test}/tiny.fna"
          status=0
          env -u GVCLASS_DB ./gvclass screen "${screen_test}/tiny.fna" \
            --image "${PWD}/gvclass.sif" \
            --resource-cache-dir "${screen_test}/cache" \
            -o "${screen_test}/output" 2> "${screen_test}/stderr.log" || status=$?
          cat "${screen_test}/stderr.log"
          test "${status}" -eq 1
          grep -E $'^tiny\tfailed\tfailed\t' "${screen_test}/output/contig_screen_summary.tsv"
          test -f "${screen_test}/output/tiny.summary.txt"
          grep -F 'manifest SHA-256 mismatch at /opt/gvclass/resources/contig_screen/manifest.json' \
            "${screen_test}/stderr.log"
          # This checks routing, mounts and integrity rejection.

      - name: Install pinned screen resources and screen example through SIF
        timeout-minutes: 120
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/gvclass-validation"
          df -h "${RUNNER_TEMP}" "${PWD}" | tee "${RUNNER_TEMP}/gvclass-validation/disk.txt"
          du -h gvclass.sif | tee -a "${RUNNER_TEMP}/gvclass-validation/disk.txt"
          apptainer exec -B "${RUNNER_TEMP}:/screen-resources:ro" \
            gvclass.sif python - /screen-resources <<'PYTHON'
          """Require space for the joined screen archive and extracted resources."""

          import shutil
          import sys

          free = shutil.disk_usage(sys.argv[1]).free
          if free < 12 * 1024**3:
              raise SystemExit(
                  f"Screen installation requires 12 GiB free; available: {free / 1024**3:.2f} GiB"
              )
          PYTHON
          env -u GVCLASS_DB ./gvclass screen --install \
            --image "${PWD}/gvclass.sif" \
            --resource-cache-dir "${RUNNER_TEMP}/gvclass-screen-cache" \
            2>&1 | tee "${RUNNER_TEMP}/gvclass-validation/install.log"
          du -sh "${RUNNER_TEMP}/gvclass-screen-cache" | tee -a "${RUNNER_TEMP}/gvclass-validation/disk.txt"
          df -h "${RUNNER_TEMP}" | tee -a "${RUNNER_TEMP}/gvclass-validation/disk.txt"
          env -u GVCLASS_DB ./gvclass screen example/GVMAG-S-1096109-37.fna \
            --image "${PWD}/gvclass.sif" \
            --resource-cache-dir "${RUNNER_TEMP}/gvclass-screen-cache" \
            -o "${RUNNER_TEMP}/gvclass-screen-results" -t 4 \
            2>&1 | tee "${RUNNER_TEMP}/gvclass-validation/screen.log"

      - name: Validate real-resource screen outputs
        run: |
          apptainer exec \
            -B "${PWD}/example:/input:ro" \
            -B "${RUNNER_TEMP}/gvclass-screen-results:/output:ro" \
            gvclass.sif python - /input/GVMAG-S-1096109-37.fna /output <<'PYTHON'
          """Validate the pinned example screen outputs before releasing the SIF."""

          import csv
          import math
          import sys
          from pathlib import Path

          source, output = map(Path, sys.argv[1:])
          bin_name = source.stem
          with source.open(encoding="utf-8") as handle:
              input_contigs = [line[1:].split()[0] for line in handle if line.startswith(">")]
          assert len(input_contigs) == len(set(input_contigs)) == 10


          def read_table(name: str) -> list[dict[str, str]]:
              """Read a TSV from the mounted screen output directory."""
              with (output / name).open(encoding="utf-8") as handle:
                  return list(csv.DictReader(handle, delimiter="\t"))


          status = read_table("contig_screen_summary.tsv")
          assert [
              {key: row[key] for key in ("bin", "cellular_status", "giant_virus_status")}
              for row in status
          ] == [
              {"bin": bin_name, "cellular_status": "ok", "giant_virus_status": "ok"}
          ], status
          cellular = read_table(f"{bin_name}.cellular.tsv")
          giant_virus = read_table(f"{bin_name}.giant_virus.tsv")
          assert len(cellular) == 33, len(cellular)
          assert len(giant_virus) == 10, len(giant_virus)
          assert len({row["contig_id"] for row in cellular}) == 33, "Duplicate cellular window"
          assert len({(row["source_contig"], row["source_start"]) for row in cellular}) == 33, (
              "Duplicate window position"
          )
          assert {row["source_contig"] for row in cellular} == set(input_contigs), (
              "Cellular contig coverage differs"
          )
          assert {row["contig"] for row in giant_virus} == set(input_contigs), (
              "Giant-virus contig coverage differs"
          )
          for rows, columns in [
              (cellular, ("p_cellular", "p_gbm", "p_context")),
              (giant_virus, ("p_foreign",)),
          ]:
              for row in rows:
                  for column in columns:
                      probability = float(row[column])
                      assert math.isfinite(probability), (column, row)
                      assert 0 <= probability <= 1, (column, row)
          print(
              "Verified both screens: 33 cellular windows, 10 giant-virus contigs, "
              "complete coverage and valid probabilities"
          )
          PYTHON

      - name: Verify automatic screening and resume through host launcher
        timeout-minutes: 30
        shell: bash
        run: |
          "${RUNNER_TEMP}/gvclass-host/bin/python" - "${RUNNER_TEMP}" "${PWD}" <<'PYTHON'
          """Run one installed-add-on classification, then reuse its screen twice."""

          import csv
          import hashlib
          import json
          import math
          import os
          import shutil
          import subprocess
          import sys
          import tarfile
          from pathlib import Path

          SCREEN_FIELDS = {
              "screen_status", "screen_cellular_pct", "screen_giant_virus_pct",
              "screen_flagged_pct",
          }
          QUERY = "GVMAG-S-1096109-37"


          def verify_plain_output(path):
              log = path.read_text(encoding="utf-8")
              assert "\x1b" not in log, "ANSI escape in plain output"
              decorations = (0x2705, 0x274C, 0x26A0, 0x2713, 0x1F4E6,
                             0x1F4E5, 0x1F4C2, 0x1F50D, 0x1F4CA,
                             0x23F1, 0x1F4BE)
              assert not any(chr(code) in log for code in decorations), (
                  "Decoration in plain output"
              )


          def read_rows(path):
              with path.open(encoding="utf-8") as handle:
                  return list(csv.DictReader(handle, delimiter="\t"))


          def read_pre_screen_summary(output):
              # The query writer saves this final-schema row before screening,
              # then archives it under the query directory. Read only that member.
              with tarfile.open(output / f"{QUERY}.tar.gz", "r:gz") as archive:
                  member = archive.getmember(f"{QUERY}/{QUERY}.final_summary.tsv")
                  assert member.isfile(), "Per-query summary must be a regular file"
                  with archive.extractfile(member) as handle:
                      lines = handle.read().decode("utf-8").splitlines()
                      rows = list(csv.DictReader(lines, delimiter="\t"))
              assert len(rows) == 1 and rows[0]["query"] == QUERY, rows
              return rows[0]


          def verify_screen_totals(row, source, manifest):
              assert set(row) == {
                  "bin", "cellular_status", "giant_virus_status",
                  "input_sha256", "manifest_sha256", "input_bp",
                  "cellular_bp", "giant_virus_bp", "flagged_bp",
                  "cellular_pct", "giant_virus_pct", "flagged_pct",
              }, "Unexpected standalone summary columns"
              assert row["bin"] == QUERY
              assert row["cellular_status"] == row["giant_virus_status"] == "ok"
              assert row["input_sha256"] == hashlib.sha256(source.read_bytes()).hexdigest()
              assert row["manifest_sha256"] == hashlib.sha256(manifest.read_bytes()).hexdigest()
              assert int(row["input_bp"]) == 175691, row
              # This pinned fixture is all-negative, not a sensitivity test.
              for field in ("cellular", "giant_virus", "flagged"):
                  assert int(row[f"{field}_bp"]) == 0, row
                  assert float(row[f"{field}_pct"]) == 0, row


          def verify_summary(path, baseline, standalone, expected_status):
              rows = read_rows(path)
              assert len(rows) == 1, rows
              row = rows[0]
              assert row["query"] == QUERY, row
              assert {key for key in row if key.startswith("screen_")} == SCREEN_FIELDS
              assert {key: value for key, value in row.items() if key not in SCREEN_FIELDS} == {
                  key: value for key, value in baseline.items() if key not in SCREEN_FIELDS
              }, "Automatic screening changed classification fields"
              assert row["screen_status"] == expected_status, row
              for field in sorted(SCREEN_FIELDS - {"screen_status"}):
                  observed = float(row[field])
                  if expected_status == "disabled":
                      assert math.isnan(observed), (field, row[field])
                  else:
                      expected = float(standalone[field.removeprefix("screen_")])
                      assert math.isfinite(observed) and 0 <= observed <= 100
                      assert observed == expected, (field, observed, expected)


          def screen_snapshot(folder):
              snapshot = {}
              for path in sorted(folder.rglob("*")):
                  if path.is_file():
                      stat = path.stat()
                      snapshot[str(path.relative_to(folder))] = {
                          "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                          "mtime_ns": stat.st_mtime_ns,
                          "inode": stat.st_ino,
                      }
              assert snapshot, "No automatic screen artifacts"
              assert f"{QUERY}/contig_screen_summary.tsv" in snapshot
              assert f"{QUERY}/screen.log" in snapshot
              return snapshot


          def query_snapshot(output):
              # Include the archive, sentinel and loose sequence/summary sidecars,
              # but not the global summary or the separate screen directory.
              snapshot = {}
              for path in sorted(output.rglob(f"{QUERY}.*")):
                  if path.is_file() and "contig_screen" not in path.relative_to(output).parts:
                      stat = path.stat()
                      with path.open("rb") as handle:
                          digest = hashlib.file_digest(handle, "sha256").hexdigest()
                      snapshot[str(path.relative_to(output))] = [digest, stat.st_mtime_ns, stat.st_ino]
              assert f"{QUERY}.tar.gz" in snapshot, "Missing query archive"
              return snapshot


          temporary, repository = map(Path, sys.argv[1:])
          evidence = temporary / "gvclass-validation"
          inputs = temporary / "gvclass-auto-screen-input"
          inputs.mkdir()
          shutil.copy2(repository / "example" / f"{QUERY}.fna", inputs)
          output = temporary / "gvclass-auto-screen-results"
          earlier = next(
              row for row in read_rows(temporary / "gvclass-results/gvclass_summary.tsv")
              if row["query"] == QUERY
          )
          classification_columns = set(earlier) - SCREEN_FIELDS
          baseline = None
          standalone_rows = read_rows(
              temporary / "gvclass-screen-results/contig_screen_summary.tsv"
          )
          assert len(standalone_rows) == 1
          standalone = standalone_rows[0]
          verify_screen_totals(
              standalone, inputs / f"{QUERY}.fna",
              temporary / "gvclass-screen-cache/contig_screen/manifest.json",
          )
          command = [
              str(repository / "gvclass"), "--image", str(repository / "gvclass.sif"),
              str(inputs), "-o", str(output), "-t", "4", "--mode-fast",
              "--plain-output", "--verbose", "--resource-cache-dir",
              str(temporary / "gvclass-screen-cache"),
          ]
          environment = dict(os.environ)
          environment.pop("GVCLASS_DB", None)
          before = None
          query_before = None
          for name, flags, expected_status in (
              ("automatic", [], "ok"),
              ("automatic-resume", ["--resume"], "ok"),
              ("automatic-disabled", ["--resume", "--no-screen"], "disabled"),
          ):
              # The host DB selects the add-on; the launcher must reset the
              # container DB to its embedded core resources. Resumes cover
              # discovery from the cache with no explicit host DB.
              if not flags:
                  environment["GVCLASS_DB"] = str(temporary / "gvclass-screen-cache")
              else:
                  environment.pop("GVCLASS_DB", None)
              log_path = evidence / f"{name}.log"
              with log_path.open("w", encoding="utf-8") as handle:
                  subprocess.run(
                      [*command, *flags], env=environment, stdout=handle,
                      stderr=subprocess.STDOUT, check=True,
                  )
              verify_plain_output(log_path)
              if baseline is None:
                  # Compare exact values within this run; thread allocations can
                  # change tree results between the one- and three-query runs.
                  individual = read_pre_screen_summary(output)
                  baseline = {key: individual[key] for key in classification_columns}
                  (evidence / "automatic-pre-screen-summary.json").write_text(
                      json.dumps(baseline, indent=2), encoding="utf-8"
                  )
              verify_summary(output / "gvclass_summary.tsv", baseline, standalone, expected_status)
              shutil.copy2(output / "gvclass_summary.tsv", evidence / f"{name}-summary.tsv")
              status = json.loads((output / "run_status.json").read_text(encoding="utf-8"))
              assert status["status"] == "complete"
              assert status["totals"]["queries"] == 1
              assert status["totals"]["failed"] == 0
              assert status["totals"]["resume_skipped"] == (0 if not flags else 1)
              snapshot = screen_snapshot(output / "contig_screen")
              query_files = query_snapshot(output)
              if before is None:
                  before = snapshot
                  query_before = query_files
              else:
                  assert snapshot == before, "Resume rewrote or replaced saved screening results"
                  assert query_files == query_before, "Resume changed query archive or sidecars"
                  log = log_path.read_text(encoding="utf-8")
                  assert "Skipping 1 completed queries" in log
                  assert "Processing query:" not in log
              (evidence / f"{name}-screen-snapshot.json").write_text(
                  json.dumps(snapshot, indent=2), encoding="utf-8"
              )
              (evidence / f"{name}-query-snapshot.json").write_text(
                  json.dumps(query_files, indent=2), encoding="utf-8"
              )
              print(f"Verified {name}: {expected_status}, unchanged classification fields")
          PYTHON

      - name: Upload container validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gvclass-validation-${{ github.ref_name }}
          path: |
            gvclass.sif.sha256
            ${{ runner.temp }}/gvclass-validation/
            ${{ runner.temp }}/gvclass-results/gvclass_summary.tsv
            ${{ runner.temp }}/gvclass-screen-results/*.tsv
            ${{ runner.temp }}/gvclass-screen-results/*.txt
            ${{ runner.temp }}/gvclass-screen-cache/contig_screen/manifest.json
            ${{ runner.temp }}/gvclass-auto-screen-results/contig_screen/**/*.tsv
            ${{ runner.temp }}/gvclass-auto-screen-results/run_status.json

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ./gvclass.sif
          format: spdx-json
          output-file: gvclass.sbom.json

      - name: Upload SIF and SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gvclass-container-${{ github.ref_name }}
          path: |
            gvclass.sif
            gvclass.sbom.json

      # Publish release SIFs to GHCR. `gvclass --apptainer` pulls the versioned
      # oras:// address by default.
      - name: Publish SIF to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          printf '%s' "${GITHUB_TOKEN}" | apptainer registry login \
            --username "${GITHUB_ACTOR}" --password-stdin oras://ghcr.io
          apptainer push gvclass.sif "oras://ghcr.io/nelli-team/gvclass:${version}"
          # Re-tag release images as :latest so consumers can pull
          # oras://ghcr.io/nelli-team/gvclass without pinning a version.
          apptainer push gvclass.sif "oras://ghcr.io/nelli-team/gvclass:latest"
          apptainer registry logout oras://ghcr.io
          echo "Published oras://ghcr.io/nelli-team/gvclass:${version} and :latest"

      # A new GHCR package is private until its visibility is changed once. This
      # step fails then, on purpose: users cannot pull a private package.
      - name: Verify anonymous pull of the published SIF
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          # No stored credentials: log out, and use a new Apptainer config and cache.
          apptainer registry logout oras://ghcr.io
          anonymous="$(mktemp -d "${RUNNER_TEMP}/gvclass-anonymous.XXXXXX")"
          mkdir "${anonymous}/config" "${anonymous}/cache" "${anonymous}/pulled"
          status=0
          APPTAINER_CONFIGDIR="${anonymous}/config" \
            APPTAINER_CACHEDIR="${anonymous}/cache" \
            apptainer pull "${anonymous}/pulled/gvclass.sif" \
            "oras://ghcr.io/nelli-team/gvclass:${version}" || status=$?
          if [ "${status}" -ne 0 ]; then
            echo "Anonymous pull failed. If the package is private, set the visibility of" \
              "nelli-team/gvclass to public once in the GHCR package settings." >&2
            exit "${status}"
          fi
          built="$(sha256sum gvclass.sif | cut -d ' ' -f 1)"
          pulled="$(sha256sum "${anonymous}/pulled/gvclass.sif" | cut -d ' ' -f 1)"
          echo "built  ${built}"
          echo "pulled ${pulled}"
          test "${built}" = "${pulled}"
