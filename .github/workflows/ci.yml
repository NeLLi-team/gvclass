name: CI

on:
  push:
    branches: [main, "v*"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, type-check, and unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.0
        with:
          pixi-version: v0.72.0
          cache: true

      - name: Lint (flake8)
        run: pixi run lint

      - name: Type-check (mypy)
        run: pixi run type-check

      - name: Unit tests (pytest)
        run: pixi run test

  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.0
        with:
          pixi-version: v0.72.0
          cache: true

      - name: Run public repo hygiene checks
        run: pixi run pytest tests/test_repo_hygiene.py -q

  golden-file:
    name: Golden-file regression on example/
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.0
        with:
          pixi-version: v0.72.0
          cache: true

      - name: Read expected DB version
        id: dbhash
        run: |
          python - <<'PY' >> $GITHUB_OUTPUT
          import re, pathlib
          txt = pathlib.Path("config/gvclass_config.yaml").read_text()
          version = re.search(r"^\s*download_version:\s*(\S+)\s*$", txt, re.M)
          print(f"version={version.group(1) if version else 'unknown'}")
          PY

      - name: Cache GVClass resources tarball and extracted DB
        uses: actions/cache@v4
        with:
          path: |
            resources
          key: gvclass-db-${{ steps.dbhash.outputs.version }}

      - name: Install pixi environment and download DB if not cached
        run: |
          pixi install
          installed_version="$(cat resources/DB_VERSION 2>/dev/null || true)"
          if [ ! -f resources/hmm/combined.hmm ] || [ "${installed_version}" != "${{ steps.dbhash.outputs.version }}" ]; then
            pixi run setup-db
          fi

      - name: Run golden-fixture regression test
        env:
          GVCLASS_RUN_GOLDEN: "1"
        run: |
          # tests/test_golden_example_summary.py runs `pixi run gvclass example`
          # with --mode-fast --plain-output, then projects the STABLE_COLUMNS
          # subset and diffs against tests/fixtures/expected_example_summary.tsv.
          # Keeps the test harness and the CI gate on exactly the same code
          # path.
          pixi run pytest tests/test_golden_example_summary.py -v

      - name: Audit compact resource labels and reference proteins
        env:
          GVCLASS_RUN_RESOURCE_AUDIT: "1"
        run: |
          pixi run pytest \
            tests/test_resource_label_integrity.py \
            tests/test_species_tree_config.py -v

  container-build:
    name: Build Apptainer SIF and smoke-test
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    needs: [lint-and-test, repo-hygiene, golden-file]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify release tag matches software version
        id: release
        shell: bash
        run: |
          software_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml | head -n 1)"
          test -n "${software_version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${software_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match software version ${software_version}" >&2
            exit 1
          fi
          echo "software_version=${software_version}" >> "${GITHUB_OUTPUT}"

      - name: Install Apptainer
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer

      - name: Build SIF
        run: |
          apptainer build gvclass.sif containers/apptainer/gvclass.def
          sha256sum gvclass.sif > gvclass.sif.sha256

      - name: Verify SIF software, resource, and model identities
        run: |
          # Exercise the bare `gvclass` command via PATH + the
          # /usr/local/bin/gvclass symlink and non-root exec permissions —
          # the way workflow engines (Snakemake/Nextflow) call it — rather
          # than the absolute /opt/gvclass/gvclass path. This way a regression
          # of the container command-publishing fix fails CI.
          version_output="$(apptainer exec gvclass.sif gvclass --version)"
          grep -Fqx "  Software version: v${{ steps.release.outputs.software_version }}" <<< "${version_output}"
          resolved="$(apptainer exec gvclass.sif sh -c 'command -v gvclass')"
          echo "gvclass resolves to: ${resolved}"
          test "${resolved}" = "/usr/local/bin/gvclass"
          apptainer exec gvclass.sif sh -c 'test "$GVCLASS_RESOURCE_CACHE" = "/resource-cache"'
          database_version="$(apptainer exec gvclass.sif cat /opt/gvclass/resources/DB_VERSION)"
          if [[ "${database_version}" != "v2.1.0" ]]; then
            echo "Release requires resource bundle v2.1.0; image contains ${database_version}" >&2
            exit 1
          fi
          apptainer exec gvclass.sif python - <<'PY'
          import hashlib
          from pathlib import Path

          from src.core.contamination_scoring import CONTAMINATION_MODEL_SHA256
          from src.core.novelty_completeness import COMPLETENESS_MODEL_SHA256

          expected_models = {
              Path("/opt/gvclass/resources/contamination/model.joblib"): CONTAMINATION_MODEL_SHA256,
              Path("/opt/gvclass/resources/completeness/model.joblib"): COMPLETENESS_MODEL_SHA256,
          }
          for model_path, expected_digest in expected_models.items():
              with model_path.open("rb") as model_file:
                  observed_digest = hashlib.file_digest(model_file, "sha256").hexdigest()
              if observed_digest != expected_digest:
                  raise SystemExit(
                      f"Model digest mismatch for {model_path}: "
                      f"expected {expected_digest}, got {observed_digest}"
                  )
              print(f"Verified {model_path}: {observed_digest}")
          PY

      - name: Record CPU and frozen SIF runtime metadata
        run: |
          mkdir -p "${RUNNER_TEMP}/gvclass-validation"
          lscpu --json > "${RUNNER_TEMP}/gvclass-validation/host-cpu.json"
          apptainer exec gvclass.sif python - <<'PYTHON' > "${RUNNER_TEMP}/gvclass-validation/sif-runtime.json"
          """Record library and CPU settings without process or environment dumps."""

          import json

          import numpy as np
          import scipy
          import sklearn
          import threadpoolctl
          import torch

          runtime = {
              "context": "fresh SIF process before CLI per-task thread limits",
              "torch_version": torch.__version__,
              "numpy_version": np.__version__,
              "scipy_version": scipy.__version__,
              "sklearn_version": sklearn.__version__,
              "torch_cpu_capability": torch.backends.cpu.get_cpu_capability(),
              "torch_num_threads": torch.get_num_threads(),
              "torch_num_interop_threads": torch.get_num_interop_threads(),
              "threadpools": [
                  {key: value for key, value in pool.items() if key != "filepath"}
                  for pool in threadpoolctl.threadpool_info()
              ],
              "torch_config": torch.__config__.show(),
          }
          print(json.dumps(runtime, indent=2))
          PYTHON

      - name: Run SIF classification and screen smoke tests
        shell: bash
        run: |
          apptainer run gvclass.sif screen --help
          mkdir -p "${RUNNER_TEMP}/gvclass-results" "${RUNNER_TEMP}/gvclass-cache" "${RUNNER_TEMP}/gvclass-validation"
          ./gvclass --image "${PWD}/gvclass.sif" example \
            -o "${RUNNER_TEMP}/gvclass-results" -t 4 --mode-fast --plain-output --verbose \
            --resource-cache-dir "${RUNNER_TEMP}/gvclass-cache" \
            2>&1 | tee "${RUNNER_TEMP}/gvclass-validation/classification.log"
          apptainer exec \
            -B "${RUNNER_TEMP}/gvclass-results:/output:ro" \
            -B "${RUNNER_TEMP}/gvclass-validation:/validation:ro" \
            -B "${PWD}/tests/fixtures/expected_example_summary.tsv:/expected.tsv:ro" \
            -B "${PWD}/tests/test_golden_example_summary.py:/golden_test.py:ro" \
            -B "${PWD}/scripts/ci:/ci:ro" \
            gvclass.sif python /ci/check_sif_classification.py

      - name: Set up pinned Python for the host launcher checks
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          enable-cache: false

      - name: Verify resume through the host launcher
        shell: bash
        run: |
          uv venv --no-project --managed-python --python 3.11.14 "${RUNNER_TEMP}/gvclass-host"
          uv pip install --python "${RUNNER_TEMP}/gvclass-host/bin/python" \
            --only-binary :all: biopython==1.85 numpy==2.4.2
          "${RUNNER_TEMP}/gvclass-host/bin/python" scripts/ci/verify_host_resume.py \
            "${PWD}/gvclass.sif" "${RUNNER_TEMP}/gvclass-results" \
            "${RUNNER_TEMP}/gvclass-cache" "${RUNNER_TEMP}/gvclass-validation"

      - name: Verify host screen launcher rejects an invalid bundle
        run: |
          screen_test="$(mktemp -d "${RUNNER_TEMP}/gvclass-screen.XXXXXX")"
          mkdir -p "${screen_test}/cache/contig_screen"
          printf '{}\n' > "${screen_test}/cache/contig_screen/manifest.json"
          printf '>tiny\nACGT\n' > "${screen_test}/tiny.fna"
          status=0
          env -u GVCLASS_DB ./gvclass screen "${screen_test}/tiny.fna" \
            --image "${PWD}/gvclass.sif" \
            --resource-cache-dir "${screen_test}/cache" \
            -o "${screen_test}/output" 2> "${screen_test}/stderr.log" || status=$?
          cat "${screen_test}/stderr.log"
          test "${status}" -eq 1
          grep -E $'^tiny\tfailed\tfailed\t' "${screen_test}/output/contig_screen_summary.tsv"
          test -f "${screen_test}/output/tiny.summary.txt"
          grep -F 'manifest SHA-256 mismatch at /opt/gvclass/resources/contig_screen/manifest.json' \
            "${screen_test}/stderr.log"
          # This checks routing, mounts and integrity rejection.

      - name: Install pinned screen resources and screen example through SIF
        timeout-minutes: 120
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/gvclass-validation"
          df -h "${RUNNER_TEMP}" "${PWD}" | tee "${RUNNER_TEMP}/gvclass-validation/disk.txt"
          du -h gvclass.sif | tee -a "${RUNNER_TEMP}/gvclass-validation/disk.txt"
          apptainer exec -B "${RUNNER_TEMP}:/screen-resources:ro" \
            gvclass.sif python - /screen-resources <<'PYTHON'
          """Require space for the joined screen archive and extracted resources."""

          import shutil
          import sys

          free = shutil.disk_usage(sys.argv[1]).free
          if free < 12 * 1024**3:
              raise SystemExit(
                  f"Screen installation requires 12 GiB free; available: {free / 1024**3:.2f} GiB"
              )
          PYTHON
          env -u GVCLASS_DB ./gvclass screen --install \
            --image "${PWD}/gvclass.sif" \
            --resource-cache-dir "${RUNNER_TEMP}/gvclass-screen-cache" \
            2>&1 | tee "${RUNNER_TEMP}/gvclass-validation/install.log"
          du -sh "${RUNNER_TEMP}/gvclass-screen-cache" | tee -a "${RUNNER_TEMP}/gvclass-validation/disk.txt"
          df -h "${RUNNER_TEMP}" | tee -a "${RUNNER_TEMP}/gvclass-validation/disk.txt"
          env -u GVCLASS_DB ./gvclass screen example/GVMAG-S-1096109-37.fna \
            --image "${PWD}/gvclass.sif" \
            --resource-cache-dir "${RUNNER_TEMP}/gvclass-screen-cache" \
            -o "${RUNNER_TEMP}/gvclass-screen-results" -t 4 \
            2>&1 | tee "${RUNNER_TEMP}/gvclass-validation/screen.log"

      - name: Validate real-resource screen outputs
        run: |
          apptainer exec \
            -B "${PWD}/example:/input:ro" \
            -B "${RUNNER_TEMP}/gvclass-screen-results:/output:ro" \
            -B "${PWD}/scripts/ci:/ci:ro" \
            gvclass.sif python /ci/validate_screen_outputs.py /input/GVMAG-S-1096109-37.fna /output

      - name: Verify automatic screening and resume through host launcher
        timeout-minutes: 30
        shell: bash
        run: |
          "${RUNNER_TEMP}/gvclass-host/bin/python" scripts/ci/verify_auto_screen.py \
            "${RUNNER_TEMP}" "${PWD}"

      - name: Upload container validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gvclass-validation-${{ github.ref_name }}
          path: |
            gvclass.sif.sha256
            ${{ runner.temp }}/gvclass-validation/
            ${{ runner.temp }}/gvclass-results/gvclass_summary.tsv
            ${{ runner.temp }}/gvclass-screen-results/*.tsv
            ${{ runner.temp }}/gvclass-screen-results/*.txt
            ${{ runner.temp }}/gvclass-screen-cache/contig_screen/manifest.json
            ${{ runner.temp }}/gvclass-auto-screen-results/contig_screen/**/*.tsv
            ${{ runner.temp }}/gvclass-auto-screen-results/run_status.json

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ./gvclass.sif
          format: spdx-json
          output-file: gvclass.sbom.json

      - name: Upload SIF and SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gvclass-container-${{ github.ref_name }}
          path: |
            gvclass.sif
            gvclass.sbom.json

      # Publish release SIFs to GHCR. `gvclass --apptainer` pulls the versioned
      # oras:// address by default.
      - name: Publish SIF to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          printf '%s' "${GITHUB_TOKEN}" | apptainer registry login \
            --username "${GITHUB_ACTOR}" --password-stdin oras://ghcr.io
          apptainer push gvclass.sif "oras://ghcr.io/nelli-team/gvclass:${version}"
          # Re-tag release images as :latest so consumers can pull
          # oras://ghcr.io/nelli-team/gvclass without pinning a version.
          apptainer push gvclass.sif "oras://ghcr.io/nelli-team/gvclass:latest"
          apptainer registry logout oras://ghcr.io
          echo "Published oras://ghcr.io/nelli-team/gvclass:${version} and :latest"

      # A new GHCR package is private until its visibility is changed once. This
      # step fails then, on purpose: users cannot pull a private package.
      - name: Verify anonymous pull of the published SIF
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          # No stored credentials: log out, and use a new Apptainer config and cache.
          apptainer registry logout oras://ghcr.io
          anonymous="$(mktemp -d "${RUNNER_TEMP}/gvclass-anonymous.XXXXXX")"
          mkdir "${anonymous}/config" "${anonymous}/cache" "${anonymous}/pulled"
          status=0
          APPTAINER_CONFIGDIR="${anonymous}/config" \
            APPTAINER_CACHEDIR="${anonymous}/cache" \
            apptainer pull "${anonymous}/pulled/gvclass.sif" \
            "oras://ghcr.io/nelli-team/gvclass:${version}" || status=$?
          if [ "${status}" -ne 0 ]; then
            echo "Anonymous pull failed. If the package is private, set the visibility of" \
              "nelli-team/gvclass to public once in the GHCR package settings." >&2
            exit "${status}"
          fi
          built="$(sha256sum gvclass.sif | cut -d ' ' -f 1)"
          pulled="$(sha256sum "${anonymous}/pulled/gvclass.sif" | cut -d ' ' -f 1)"
          echo "built  ${built}"
          echo "pulled ${pulled}"
          test "${built}" = "${pulled}"
